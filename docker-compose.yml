# Local stack. `pnpm db:up` starts only `db` (for `pnpm dev`); `docker compose up -d --build` also runs the API image.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Services reach each other by service name on the compose network.
      DATABASE_URL: postgres://vinomatrix:vinomatrix@db:5432/vinomatrix
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_USER: vinomatrix
      POSTGRES_PASSWORD: vinomatrix
      POSTGRES_DB: vinomatrix
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: the image's first-run init server listens on the socket only,
      # so a socket check reports healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vinomatrix -d vinomatrix"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
